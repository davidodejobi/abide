name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  # Keep in step with .fvmrc and flutter.yml. The reviewer must analyze against
  # the same SDK the test job uses, or it will report analyzer errors nobody
  # else can reproduce.
  FLUTTER_VERSION: "3.38.4"

jobs:
  claude-review:
    # Only review same-repo PRs. Fork PRs don't receive the secret anyway, so
    # this just avoids confusing failed runs on external contributions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Without a toolchain the reviewer can only read code and reason about it.
      # It said so itself on #33: "Couldn't run flutter analyze / flutter test
      # (no fvm/flutter/dart binaries available) -- the logic review above is a
      # manual trace, not a test run." The SDK lets it settle a static question
      # instead of hedging it.
      #
      # The SDK is here for `flutter analyze` ONLY, and the prompt forbids
      # `flutter test`. This job carries CLAUDE_CODE_OAUTH_TOKEN and a token with
      # pull-requests: write, and it runs on same-repo PRs -- which includes
      # Dependabot's. Running tests here would execute PR-authored and
      # third-party package code beside those secrets, turning a routine
      # dependency bump into a credential-exfiltration path. `analyze` reads the
      # code without executing it, so it carries none of that.
      #
      # Dynamic verification already exists: the `flutter` workflow runs the
      # full suite on every PR and holds no Claude secret. Do not "just add
      # tests here" to save a job -- that is the whole hazard.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `dart pub get` resolves and downloads packages but does not execute them
      # (Dart has no npm-style install scripts), so this is safe here. Analyzing
      # without it would drown the reviewer in phantom "uri_does_not_exist".
      - name: Install dependencies
        run: flutter pub get

      - name: Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this, the review runs to completion and then posts nothing:
          # the findings only exist in the job log, where nobody reads them.
          # This forces the tracking comment on pull_request events.
          track_progress: true
          prompt: |
            Review this pull request for the Abide Flutter app.
            Focus on:
            - Bugs, logic errors, and edge cases
            - Security issues
            - Adherence to the conventions in CLAUDE.md (Riverpod plain-Notifier
              pattern, auto_route usage, theme/font tokens)
            - Flutter/Dart best practices and analyzer cleanliness

            The Flutter SDK is installed, `flutter` and `dart` are on PATH, and
            `flutter pub get` has already run. Call them directly -- do NOT
            prefix with `fvm`. CLAUDE.md tells humans to use fvm because it pins
            the SDK on their machine; CI has already pinned it, and there is no
            fvm binary here.

            You MAY run `flutter analyze` (and `dart analyze`) to settle a
            question about types, unused code, or analyzer cleanliness.

            Do NOT run `flutter test`, `dart run`, `dart pub run`, or anything
            else that executes code from this branch or its dependencies. This
            job holds a secret, and running tests here would execute PR-authored
            and third-party package code beside it. The `flutter` workflow
            already runs the full suite with no such secret on every PR -- read
            its result instead of reproducing it. If a finding can only be
            settled by executing code, say so and say what you would run; do not
            run it.

            State which findings you verified with the analyzer and which are
            reasoning only. Do not blur the two: a hedge presented as a fact is
            worse than an honest hedge.

            Be concise. Only flag issues that genuinely matter; skip nitpicks.
            Leave inline comments on specific lines where useful.
          # No --allowedTools here on purpose. Bash is already permitted: the
          # reviewer reported "no fvm/flutter/dart binaries available", which it
          # could only learn by running something and getting "command not
          # found". The binaries were the only thing missing, and the step above
          # supplies them. Passing --allowedTools would add no capability while
          # risking replacing the action's default allowlist, which is what lets
          # it post the review in the first place.
          claude_args: |
            --max-turns 35

      # The action does not fail the job when the review itself fails, so a
      # review that never ran reports a green check. This gate is the fix.
      #
      # It reads the execution log rather than a step output: the action exposes
      # execution_file / session_id / structured_output — there is NO `conclusion`
      # output, so the previous version of this gate compared against an empty
      # string and failed every run, including the ones where Claude reviewed
      # perfectly well.
      - name: Fail if the review did not run
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::Claude produced no execution log — the action was skipped or died before starting."
            echo "If this PR edits a workflow file, that is expected: the action requires the"
            echo "workflow to match the default branch, and it resolves once merged."
            exit 1
          fi

          # The log is the SDK message stream; the final `result` message carries
          # is_error and the message text.
          result=$(jq -c 'if type == "array" then (map(select(.type == "result")) | last) else . end' "$EXECUTION_FILE")

          if [ "$(printf '%s' "$result" | jq -r '.is_error')" = "true" ]; then
            echo "::error::Claude review errored. Message follows."
            printf '%s' "$result" | jq -r '.result // .error // "no message in log"'
            echo "A ~2s, 1-turn failure almost always means CLAUDE_CODE_OAUTH_TOKEN is expired:"
            echo "run 'claude setup-token' locally and update the repo secret."
            exit 1
          fi

          echo "Claude review completed in $(printf '%s' "$result" | jq -r '.num_turns') turns."

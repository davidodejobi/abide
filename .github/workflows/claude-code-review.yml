name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    # Only review same-repo PRs. Fork PRs don't receive the secret anyway, so
    # this just avoids confusing failed runs on external contributions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action hides Claude's output by default, so a failing review is
          # invisible in the logs. We only ever pass it a public diff, so show it.
          show_full_output: true
          prompt: |
            Review this pull request for the Abide Flutter app.
            Focus on:
            - Bugs, logic errors, and edge cases
            - Security issues
            - Adherence to the conventions in CLAUDE.md (Riverpod plain-Notifier
              pattern, auto_route usage, fvm tooling, theme/font tokens)
            - Flutter/Dart best practices and analyzer cleanliness
            Be concise. Only flag issues that genuinely matter; skip nitpicks.
            Leave inline comments on specific lines where useful.
          claude_args: |
            --max-turns 25

      # The action swallows a failed review and still reports the job green, so
      # every run since 2026-06-26 looked healthy while posting nothing. Fail
      # loudly instead.
      - name: Fail if the review did not run
        if: steps.claude.outputs.conclusion != 'success'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          echo "::error::Claude review did not complete (conclusion: ${CONCLUSION:-unknown})."
          echo "Most likely CLAUDE_CODE_OAUTH_TOKEN is expired or out of quota."
          echo "Refresh it locally with 'claude setup-token' and update the repo secret."
          exit 1

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for the Abide Flutter app.
            Focus on:
            - Bugs, logic errors, and edge cases
            - Security issues
            - Adherence to the conventions in CLAUDE.md (Riverpod plain-Notifier
              pattern, auto_route usage, fvm tooling, theme/font tokens)
            - Flutter/Dart best practices and analyzer cleanliness
            Be concise. Only flag issues that genuinely matter; skip nitpicks.
            Leave inline comments on specific lines where useful.
          claude_args: |
            --max-turns 6

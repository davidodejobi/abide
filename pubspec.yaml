name: openbaptisthymnal
description: "A new Flutter project."
publish_to: "none"
version: 0.2.0+9

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.2
  crypto: ^3.0.3
  logging: ^1.2.0
  toastification: ^3.0.3
  vector_graphics: ^1.1.19
  phosphor_flutter:
    path: third_party/phosphor_flutter
  auto_size_text: ^3.0.0
  lottie: ^3.3.2
  auto_route: ^11.2.0
  shared_preferences: ^2.5.4
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  image: ^4.7.2
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  package_info_plus: ^9.0.0
  audio_waveforms: ^1.3.0
  wakelock_plus: ^1.3.3
  audio_session: ^0.2.2
  drift: ^2.35.4
  sqlite3: ^3.0.0
  path: ^1.9.1
  collection: ^1.18.0
  uuid: ^4.5.3
  appflowy_editor:
    path: third_party/appflowy_editor
  gal: ^2.3.3
  supabase_flutter: ^2.18.3
  material_ui: ^1.11.1
  flutter_scene: ^0.24.6
  vector_math: ^2.1.4
  markdown: ^7.3.1
  lumway_whisper:
    path: packages/lumway_whisper
  connectivity_plus: ^7.3.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  alchemist: ^0.15.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  freezed: ^4.0.1
  json_serializable: ^6.7.1
  vector_graphics_compiler: ^1.1.19
  auto_route_generator: ^10.6.0
flutter:
  uses-material-design: true
  assets:
    - assets/hymnal/
    - assets/hymnal/languages/
    - assets/hymnal/pairs/
    - assets/bible/en-kjv/
    - assets/bible/en-kjv/books/
    - assets/bible/yo-bmy/
    - assets/bible/yo-bmy/books/
    - assets/bible/en-bsb/
    - assets/bible/en-bsb/books/
    - assets/bible/en-asv/
    - assets/bible/en-asv/books/
    - assets/bible/en-ylt/
    - assets/bible/en-ylt/books/
    - assets/bible/ha-biblica/
    - assets/bible/ha-biblica/books/
    - assets/bible/ig-biblica/
    - assets/bible/ig-biblica/books/
    - assets/bible/yo-biblica/
    - assets/bible/yo-biblica/books/
    - assets/plans/
    - assets/images/lottie/
    - assets/images/road/
    - assets/images/road/living/
    - assets/images/road/models/
    - assets/fonts/licenses/
    - path: assets/images/icons/
      transformers:
        - package: vector_graphics_compiler

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: GentiumBookPlus
      fonts:
        - asset: assets/fonts/GentiumBookPlus-Regular.ttf
        - asset: assets/fonts/GentiumBookPlus-Bold.ttf
          weight: 700
        - asset: assets/fonts/GentiumBookPlus-Italic.ttf
          style: italic
        - asset: assets/fonts/GentiumBookPlus-BoldItalic.ttf
          weight: 700
          style: italic

    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf

    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
        - asset: assets/fonts/EBGaramond-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/EBGaramond-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/EBGaramond-BoldItalic.ttf
          weight: 700
          style: italic

    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Thin.ttf
          weight: 100

    - family: ShantellSans
      fonts:
        - asset: assets/fonts/ShantellSans-Variable.ttf

    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
